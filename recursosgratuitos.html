<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursos gratuitos.</title>
<meta name="description" content="Recursos gratuitos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ EBOOK FOAM ROLLER (lead magnet) ============ -->
<section class="lead-magnet" id="ebook-foam-roller">
  <div class="lead-magnet__media">
    <img src="assets/ebook-cover.jpg" alt="Portada del ebook Foam Roller para Corredores">
  </div>
  <div class="lead-magnet__content">
    <p class="section-eyebrow">Descarga gratis</p>
    <h2 class="section-title">Foam Roller para Corredores</h2>
    <p class="lead-magnet__sub">Rutinas para gemelos, isquiotibiales, cuádriceps y cintilla iliotibial. Directo a tu email en menos de 1 minuto.</p>

    <form class="lead-magnet__form" id="ebookForm" novalidate>
      <input type="email" id="ebookEmail" name="email" placeholder="tu@email.com" autocomplete="email" required>
      <label class="lead-magnet__consent">
        <input type="checkbox" id="ebookConsent" required>
        <span>Acepto recibir emails con contenido y ofertas de @carloss_athlete</span>
      </label>
      <button type="submit" class="btn btn--primary btn--full" id="ebookSubmit">Envíamelo gratis</button>
      <p class="lead-magnet__status" id="ebookStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

</body>
</html>
